# CI for the governance OS (Python-only). Two verification jobs run in parallel
# on push/PR; both must pass for the workflow to succeed.
#
# Single source of truth for the smoke invariants: pipeline/governance_verify_all.py — if the
# invariants change, update that script + ARCHITECTURE.md (§5 Runtime invariants) together.
#
# Gates run by `python pipeline/governance_verify_all.py` (smoke job):
#   - Doc-anchor drift (check_doc_claims on ARCHITECTURE.md; fatal kinds hard-fail
#     local + CI, advisory kinds warn)
#   - Coordination-state (check_coordination; FATAL hard-fails local + CI,
#     ADVISORY warns)
#   - Anti-ceremony (check_no_ceremony; hard-fail local + CI)
#   - Adoption-placeholder (check_placeholders; hard-fail local + CI — ADR-002)
#   - Frozen historical report bytes + current compact-pair reports (check_go_schema; hard-fail local + CI)
#   - ARCHITECTURE Last-verified (check_arch_freshness; inert unless ARCHITECTURE.md
#     changed vs merge-base; fetch-depth: 0 already set for merge-base resolution)
#
# Tests run by `pytest tests` (pytest job):
#   - Complete unit and integration contract suite
#
# Advisory (non-gating) jobs: ruff, mypy, and shellcheck run continue-on-error
# so lint/type/shell findings are visible without blocking a merge. Promote one
# to gating only after compiling a hashed requirements-lint.txt and driving the
# findings to zero.
#
# Scope intentionally NOT included:
#   - Gating lint/type checks    - Deployment / release / changelog workflows
#   - Code coverage reporting
#
# Actions are pinned to immutable commits; comments record the verified release tags.
#
# Security review: no untrusted-input interpolation appears in `run:` blocks.
# Trusted pull_request_target admission lives alone in admission.yml so a
# skipped candidate-workflow job cannot share its required check context.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NO_CEREMONY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  smoke:
    name: ci_smoke (governance gates + runtime invariants)
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Run ci_smoke (single source of truth for runtime invariants)
        run: python pipeline/governance_verify_all.py

  pytest:
    name: pytest tests (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      # One version's failure must not cancel the others: the surviving jobs
      # are the evidence that distinguishes a version-specific regression from
      # a general one.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIPELINE_REQUIRE_EXECUTED_TEST: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Run complete test suite
        run: python -m pytest tests --tb=short -q

      - name: Run no-ceremony detector (ADR-028)
        run: python pipeline/check_no_ceremony.py

  pytest-linux-hermetic:
    # One Linux leg with an IN-REPO basetemp. Two things the macOS matrix does
    # not: (1) it surfaces the Unix-FHS assumptions (/usr/bin/git, /var/empty)
    # that only bite off-macOS, and (2) it runs scratch dirs inside the
    # worktree, so the git-discovery ceiling (pipeline/git_runner.py,
    # tests/conftest.py) is proven — without it, a non-repo scratch root would
    # find the enclosing checkout instead of answering "unavailable".
    name: pytest (ubuntu, in-repo scratch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIPELINE_REQUIRE_EXECUTED_TEST: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Run suite with in-repo scratch (hermeticity + portability)
        run: |
          mkdir -p .pytest-verify-tmp/ci-hermetic
          python -m pytest tests --tb=short -q \
            --basetemp=.pytest-verify-tmp/ci-hermetic

  lint-advisory:
    # Non-gating: ruff / mypy / shellcheck findings are visible but never block
    # a merge (continue-on-error). ubuntu-latest ships shellcheck preinstalled.
    # ruff/mypy are installed UNPINNED here on purpose — this job is advisory;
    # gating requires a hashed requirements-lint.txt first.
    name: lint (advisory, non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install advisory linters (unpinned; advisory only)
        run: pip install ruff mypy

      - name: ruff (advisory)
        run: ruff check pipeline tests tools || true

      - name: mypy (advisory)
        run: mypy --ignore-missing-imports pipeline/git_runner.py pipeline/protocol_mailbox.py || true

      - name: shellcheck (advisory)
        run: |
          shellcheck --severity=warning \
            coordination/bin/send-event \
            bin/pipeline || true
