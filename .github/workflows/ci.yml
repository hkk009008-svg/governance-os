# CI for the governance OS (Python-only). Two verification jobs run in parallel
# on push/PR; both must pass for the workflow to succeed. A fourth manual-only
# threeway signer job can emit a signed ci_result after they pass during go-live
# (workflow_dispatch with a validated integration SHA).
#
# Single source of truth for the smoke invariants: scripts/ci_smoke.py — if the
# invariants change, update that script + ARCHITECTURE.md §15 together.
#
# Scope intentionally NOT included (per the 2026-05-24 Session 1 brief):
#   - Linting (ruff, eslint)        - Deployment / release / changelog workflows
#   - Code coverage reporting       - Matrix builds
#
# Action majors pinned at v6 (Node-24 runtimes, per GitHub's 2026-06-16 forcing).
#
# Security review:
#   - No untrusted-input interpolation in `run:` blocks. The manual threeway
#     integration SHA is passed via an env var, validated as a 40-char lowercase
#     hex SHA, then used only after that check.
#   - Only ${{ github.workflow }} + ${{ github.ref }} appear in the concurrency
#     group key (the canonical GitHub pattern); ref is not used in any shell command.
#   - No reference to github.event.*, github.head_ref, or commit messages.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      integration_sha:
        description: Exact CAS-merged integration commit SHA to test and sign
        required: true
        type: string
      integration_ref:
        description: Fetchable branch, tag, or ref whose HEAD is integration_sha
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ci_smoke (governance gates + runtime invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.integration_ref || github.sha }}
          fetch-depth: 0

      - name: Verify threeway integration checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
        run: |
          case "$INTEGRATION_SHA" in
            *[!0-9a-f]*|'')
              echo "integration_sha must be a lowercase 40-hex Git SHA" >&2
              exit 1
              ;;
          esac
          test "${#INTEGRATION_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ci_smoke (single source of truth for §15 invariants)
        run: python scripts/ci_smoke.py

  pytest-unit:
    name: pytest tests/unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.integration_ref || github.sha }}
          fetch-depth: 0

      - name: Verify threeway integration checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
        run: |
          case "$INTEGRATION_SHA" in
            *[!0-9a-f]*|'')
              echo "integration_sha must be a lowercase 40-hex Git SHA" >&2
              exit 1
              ;;
          esac
          test "${#INTEGRATION_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/unit --tb=short -q

      - name: Execute strict-xfail regression pins (--runxfail)
        # ADR-027 FIX-2: run any strict-xfail regression pins with --runxfail so a
        # landed fix (XPASS) fails CI rather than passing silently. The suite has no
        # pins yet; this wires the gate so the FIRST pin added is executed, not declared.
        run: python -m pytest tests/unit --runxfail -q

      - name: Run no-ceremony detector (ADR-028)
        run: python scripts/check_no_ceremony.py

  threeway-ci-result:
    name: Emit threeway ci_result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke, pytest-unit]
    if: github.event_name == 'workflow_dispatch' && vars.THREEWAY_BUS_LIVE == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      INTEGRATION_SHA: ${{ inputs.integration_sha }}
    steps:
      # Signing runs from trusted main after the integration SHA passed both test
      # jobs above. The ci private key never runs candidate-controlled code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install signing dependencies
        run: pip install -r requirements-dev.txt

      - name: Emit signed ci_result for tested integration SHA
        env:
          THREEWAY_KEYSTORE: ${{ runner.temp }}/threeway_keys
          CI_PRIVATE_KEY: ${{ secrets.THREEWAY_CI_KEY }}
        run: |
          case "$INTEGRATION_SHA" in
            *[!0-9a-f]*|'')
              echo "integration_sha must be a lowercase 40-hex Git SHA" >&2
              exit 1
              ;;
          esac
          test "${#INTEGRATION_SHA}" -eq 40
          mkdir -p "$THREEWAY_KEYSTORE"
          printf '%s\n' "$CI_PRIVATE_KEY" > "$THREEWAY_KEYSTORE/ci.ed25519"
          python scripts/sign_ci_result.py --integration-sha "$INTEGRATION_SHA" --result PASS --remote origin
