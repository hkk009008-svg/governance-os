[project]
name = "governance-os"
version = "0.1.0"
description = "Four-seat governance OS: coordination protocol, threeway ref-bus, and CI harness"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Root packages (threeway/) and the scripts/ modules are importable by bare name
# in tests (mirrors how ci_smoke.py runs: scripts/ on sys.path[0] + repo root).
pythonpath = [".", "scripts"]

filterwarnings = [
    # Surface all warnings during test runs so silent degradations are caught early
    "error",
    "ignore::DeprecationWarning:_pytest",
]
