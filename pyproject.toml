[project]
name = "governance-os"
version = "0.1.0"
description = "Desktop engineering harness for Codex, Claude, and AGY with governance checks"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Root packages and the pipeline/ modules are importable by bare name
# in tests (mirrors how governance_verify_all.py runs: pipeline/ on sys.path[0] + repo root).
pythonpath = [".", "pipeline"]

filterwarnings = [
    # Surface all warnings during test runs so silent degradations are caught early
    "error",
    "ignore::DeprecationWarning:_pytest",
]
