# config/model-families.toml — system-visible model ID → provider family.
#
# TRUST-GRANTING SCHEMA INPUT: this data feeds
# codex_protocol_model.models_are_independent, which gates high-risk-control
# review acceptance. Edits carry high-risk-control review class (the file is
# an authority surface in pipeline/ci_admission_gate.py); the loader fails
# closed on malformed content; unknown model IDs stay family-None and can
# never satisfy a different-family claim. Semantics:
#   - unknown model IDs may perform ordinary local work;
#   - unknown model IDs cannot satisfy different-family review;
#   - family difference is review-diversity evidence, not proof of literal
#     independence;
#   - high-risk authority never derives from a model label.
schema_version = 1

[review_admission]
# Desktop-team membership is not review admission. Current high-risk review
# remains closed to the Claude and GPT model families; AGY/Gemini may advise and
# collaborate through the team adapter but cannot satisfy the formal
# different-family requirement. Any explicitly current desktop model may
# author a candidate; only the Claude/GPT reviewer list may issue the accepting
# verdict. Family membership alone is insufficient. The wider registry remains
# parseable for advisory output and immutable historical artifacts.
active_families = ["claude", "gpt"]
active_author_models = [
    "claude-opus-5",
    "claude-fable-5",
    "claude-opus-4-7",
    "claude-sonnet-5",
    "claude-sonnet-4-6",
    "claude-opus-4-6-thinking",
    "gpt-5.6-sol",
    "gpt-5.6-terra",
    "gpt-5.6-luna",
    "gpt-5.5",
    "gpt-5.4",
    "gpt-5.4-mini",
    "gpt-5.3-codex-spark",
    "gemini-3.7-flash-high",
    "gemini-3.7-flash-medium",
    "gemini-3.7-flash-low",
    "gemini-3.6-flash-high",
    "gemini-3.6-flash-medium",
    "gemini-3.6-flash-low",
    "gemini-3.5-flash-high",
    "gemini-3.5-flash-medium",
    "gemini-3.5-flash-low",
    "gemini-3.1-pro-high",
    "gemini-3.1-pro-low",
    "gpt-oss-120b-medium",
]
active_reviewer_models = [
    "claude-opus-5",
    "claude-fable-5",
    "claude-opus-4-7",
    "claude-sonnet-5",
    "claude-sonnet-4-6",
    "claude-opus-4-6-thinking",
    "gpt-5.6-sol",
    "gpt-5.6-terra",
    "gpt-5.6-luna",
    "gpt-5.5",
    "gpt-5.4",
    "gpt-5.4-mini",
    "gpt-5.3-codex-spark",
]
# Every report already committed when explicit current-ID admission was added
# remains readable under the family rule that governed it. Reports introduced
# after this boundary must use the author/reviewer lists above.
historical_cutover = "b1390a244d2368e89bb65d65a148e55bac0d8df0"

