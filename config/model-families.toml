# config/model-families.toml — system-visible model ID → provider family.
#
# TRUST-GRANTING SCHEMA INPUT: this data feeds
# codex_protocol_model.models_are_independent, which gates high-risk-control
# review acceptance. Edits carry high-risk-control review class (the file is
# an authority surface in scripts/ci_admission_gate.py); the loader fails
# closed on malformed content; unknown model IDs stay family-None and can
# never satisfy a different-family claim. Semantics:
#   - unknown model IDs may perform ordinary local work;
#   - unknown model IDs cannot satisfy different-family review;
#   - family difference is review-diversity evidence, not proof of literal
#     independence;
#   - high-risk authority never derives from a model label.
schema_version = 1

[provider_prefixes]
"anthropic-" = "claude"
"openai-" = "gpt"
"google-" = "gemini"
"xai-" = "grok"

[families]
"claude-fable-5" = "claude"
"claude-opus-5" = "claude"
"claude-sonnet-5" = "claude"
"claude-sonnet-4-6" = "claude"
"claude-opus-4-6-thinking" = "claude"
"gpt-5" = "gpt"
"gpt-5-codex" = "gpt"
"gpt-5.6-sol" = "gpt"
"gpt-5.6-terra" = "gpt"
"chatgpt-4o" = "gpt"
"o1" = "gpt"
"o3" = "gpt"
"o3-mini" = "gpt"
"o4" = "gpt"
"gpt-oss-120b" = "gpt"
"gpt-oss-120b-medium" = "gpt"
"gemini-3.6" = "gemini"
"gemini-3.6-flash" = "gemini"
"gemini-3.6-flash-high" = "gemini"
"gemini-3.6-flash-medium" = "gemini"
"gemini-3.6-flash-low" = "gemini"
"gemini-3.5-flash-high" = "gemini"
"gemini-3.5-flash-medium" = "gemini"
"gemini-3.5-flash-low" = "gemini"
"gemini-3.1-pro-high" = "gemini"
"gemini-3.1-pro-low" = "gemini"
