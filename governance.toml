# governance.toml — declarative kernel/target binding registry (ADR-013).
#
# This file answers "which product repos can this kernel govern" without
# editing Python constants. evidence-ledger remains the DEFAULT target
# (ADR-008 continuity); additional works register a [targets.<name>] table.
#
# Active-target resolution order (scripts/target_binding.py):
#   CLI --target  >  GOVERNANCE_TARGET env  >  [binding].default_target
# Local-checkout override for the selected target: GOVERNANCE_TARGET_PATH env.
# Missing/unknown/ambiguous binding fails closed with a corrective message.

[kernel]
repository = "hkk009008-svg/governance-os"

[binding]
default_target = "evidence-ledger"

[targets.evidence-ledger]
repository = "hkk009008-svg/evidence-ledger"
path = "~/evidence-ledger"
route_keywords = ["ledger"]
description = "Evidence-ledger (ADR-008 designated target): trust-first home-shopping P&L product"

[paths]
# Roots a governed seat must never start from (historic wrong-kernel hazard).
forbidden_roots = ["~/Content"]
